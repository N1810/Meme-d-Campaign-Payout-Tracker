services:
  # MongoDB Single-Node Replica Set for Local ACID Transactions
  mongo:
    image: mongo:7.0
    container_name: memed-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Optional Redis Cache
  redis:
    image: redis:7-alpine
    container_name: memed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Express Backend
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: memed-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/memed_payouts?replicaSet=rs0
      JWT_SECRET: )Q{0A{]gVD#}vr6v1,RH8_IP1%&s%&t4/iL7aTFn6_I
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      REDIS_URL: redis://redis:6379
      SIMULATION_SECRET: internal-simulation-dev-key
      SPIKE_THRESHOLD_PER_UPDATE: 500000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: memed-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
